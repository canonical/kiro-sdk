name: kiro
title: Kiro SDK
adopt-info: kiro
summary: Kiro AI CLI tools
description: |
  This SDK provides the Kiro CLI for AI-assisted coding within a
  workshop. The agent is sandboxed in the workshop container. Credentials are
  persisted between workshop updates.
license: Proprietary
base: ubuntu@24.04
build-base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64, arm64]
    build-for: [amd64]
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

plugs:
  kiro-config:
    interface: mount
    workshop-target: /home/workshop/.kiro

parts:
  kiro:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
      - jq
    override-pull: |
      VERSION="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      craftctl set version="$VERSION"

      # Determine download package filename based on architecture
      # We want the linux tar.xz package for headless variant
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH_NAME="x86_64" ;;
        arm64) ARCH_NAME="aarch64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac

      DOWNLOAD_URL="https://prod.download.cli.kiro.dev/stable/${VERSION}/kirocli-${ARCH_NAME}-linux.tar.xz"
      CHECKSUM_URL="${DOWNLOAD_URL}.sha256"

      echo "Fetching checksum from $CHECKSUM_URL..."
      CHECKSUM="$(curl -fsSL "$CHECKSUM_URL" | cut -d' ' -f1)"

      if ! echo "$CHECKSUM" | grep -qE '^[a-f0-9]{64}$'; then
        echo "Invalid or missing checksum for version $VERSION ($ARCH_NAME)" >&2
        exit 1
      fi

      echo "Downloading $DOWNLOAD_URL..."
      curl -fsSL -o "$CRAFT_PART_SRC/kirocli.tar.xz" "$DOWNLOAD_URL"

      echo "Verifying checksum..."
      ACTUAL="$(sha256sum "$CRAFT_PART_SRC/kirocli.tar.xz" | cut -d' ' -f1)"
      if [ "$ACTUAL" != "$CHECKSUM" ]; then
        echo "Checksum mismatch!" >&2
        echo "  expected: $CHECKSUM" >&2
        echo "  actual:   $ACTUAL" >&2
        rm -f "$CRAFT_PART_SRC/kirocli.tar.xz"
        exit 1
      fi
      echo "Checksum OK."

      echo "Extracting archive..."
      tar -xf "$CRAFT_PART_SRC/kirocli.tar.xz" -C "$CRAFT_PART_SRC"
    override-build: |
      # Install Kiro CLI binaries
      install -Dm755 "$CRAFT_PART_SRC/kirocli/bin/kiro-cli" "$CRAFT_PRIME/bin/kiro-cli"
      install -Dm755 "$CRAFT_PART_SRC/kirocli/bin/kiro-cli-chat" "$CRAFT_PRIME/bin/kiro-cli-chat"
      install -Dm755 "$CRAFT_PART_SRC/kirocli/bin/kiro-cli-term" "$CRAFT_PRIME/bin/kiro-cli-term"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
