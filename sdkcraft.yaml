name: kiro
title: Kiro SDK
adopt-info: kiro
summary: Kiro AI CLI tools
description: |
  This SDK provides the Kiro CLI for AI-assisted coding within a
  workshop. The agent is sandboxed in the workshop container. Credentials are
  persisted between workshop updates.
license: Proprietary
base: ubuntu@24.04
build-base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64, arm64]
    build-for: [amd64]
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

plugs:
  kiro-config:
    interface: mount
    workshop-target: /home/workshop/.kiro
  # Kiro keeps its login tokens and local database here, outside ~/.kiro.
  kiro-data:
    interface: mount
    workshop-target: /home/workshop/.local/share/kiro-cli

parts:
  kiro:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
      - jq
    override-pull: |
      VERSION="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      craftctl set version="$VERSION"

      # Determine download package filename based on architecture.
      # We want the glibc (non-musl) headless linux tar.gz package; Kiro 3.x
      # no longer publishes the tar.xz archive that 2.x shipped.
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH_NAME="x86_64" ;;
        arm64) ARCH_NAME="aarch64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac

      DOWNLOAD_URL="https://prod.download.cli.kiro.dev/stable/${VERSION}/kirocli-${ARCH_NAME}-linux.tar.gz"
      CHECKSUM_URL="${DOWNLOAD_URL}.sha256"

      echo "Fetching checksum from $CHECKSUM_URL..."
      CHECKSUM="$(curl -fsSL "$CHECKSUM_URL" | cut -d' ' -f1)"

      if ! echo "$CHECKSUM" | grep -qE '^[a-f0-9]{64}$'; then
        echo "Invalid or missing checksum for version $VERSION ($ARCH_NAME)" >&2
        exit 1
      fi

      echo "Downloading $DOWNLOAD_URL..."
      curl -fsSL -o "$CRAFT_PART_SRC/kirocli.tar.gz" "$DOWNLOAD_URL"

      echo "Verifying checksum..."
      ACTUAL="$(sha256sum "$CRAFT_PART_SRC/kirocli.tar.gz" | cut -d' ' -f1)"
      if [ "$ACTUAL" != "$CHECKSUM" ]; then
        echo "Checksum mismatch!" >&2
        echo "  expected: $CHECKSUM" >&2
        echo "  actual:   $ACTUAL" >&2
        rm -f "$CRAFT_PART_SRC/kirocli.tar.gz"
        exit 1
      fi
      echo "Checksum OK."

      echo "Extracting archive..."
      tar -xf "$CRAFT_PART_SRC/kirocli.tar.gz" -C "$CRAFT_PART_SRC"
    override-build: |
      # Kiro 3.x ships a single self-contained binary; the separate
      # kiro-cli-chat and kiro-cli-term binaries from 2.x are gone.
      # Install into the part's install dir (not straight into prime) so the
      # lifecycle tracks the files and stale ones never leak into the SDK.
      install -Dm755 "$CRAFT_PART_SRC/kirocli/bin/kiro-cli" "$CRAFT_PART_INSTALL/bin/kiro-cli"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
