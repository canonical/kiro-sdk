summary: setup-project hook installs the workshop prompt for Kiro

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # setup-project installs the workshop prompt as a global steering file,
  # which is the only place Kiro loads it from.
  workshop exec -- test -f /home/workshop/.kiro/steering/workshop-prompt.md
  workshop exec -- head -1 /home/workshop/.kiro/steering/workshop-prompt.md | \
    MATCH "Workshop Container Environment Instructions"
  # The workshop user must own it, or Kiro cannot write its own state there.
  workshop exec -- stat -c '%U' /home/workshop/.kiro/steering/workshop-prompt.md | MATCH "^workshop$"

debug: |
  workshop exec -- ls -laR /home/workshop/.kiro/ || true
  workshop exec -- cat /home/workshop/.kiro/steering/workshop-prompt.md || true
